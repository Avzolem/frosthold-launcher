appId: com.avsolem.frosthold.launcher
productName: Frosthold
copyright: © 2026 Frosthold

directories:
  output: release
  buildResources: build

# Comprimir al máximo cuesta un par de minutos de compilación una sola vez y
# se los ahorra a cada persona que descargue.
compression: maximum
asar: true
npmRebuild: false
afterPack: build/after-pack.cjs

# Solo lo que la app necesita en tiempo de ejecución. `src/renderer` va tal
# cual porque el proceso principal lo carga con loadFile.
files:
  - dist/**/*
  - src/renderer/**/*
  - frosthold.config.json
  - package.json
  - '!**/*.map'

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Launcher-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Frosthold
  # El instalador solo pone el launcher. El cliente del juego lo baja la app
  # después, a la carpeta que elija el jugador.
  deleteAppDataOnUninstall: false

publish:
  provider: generic
  url: https://avsolem.com/wow/launcher/updates
  channel: latest
