<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Frosthold</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- El arte va como elemento, no como fondo de CSS: así se puede anclar a
         la derecha y dejar libre el lado izquierdo, que es donde está el hueco
         oscuro de la ilustración y donde cae todo el contenido. -->
    <!-- La piel del launcher clásico: marco, arte y banda inferior en una sola
         imagen, con el logotipo original retirado. Va estirada a la ventana, que
         conserva su proporción para que el marco no se deforme. -->
    <img class="skin" src="assets/skin.png" alt="" aria-hidden="true" />

    <img class="logo" id="app-logo" src="assets/logo.png" alt="Frosthold" />

    <header class="titlebar">
      <div class="brand">
        <span class="patch" id="realm-patch">3.3.5a</span>
        <span class="version" id="app-version"></span>
      </div>
      <div class="window-buttons">
        <button id="btn-min" title="Minimizar" aria-label="Minimizar la ventana">—</button>
        <button id="btn-close" title="Cerrar" aria-label="Cerrar el launcher">✕</button>
      </div>
    </header>

    <main>
      <!-- Columna izquierda: todo el contenido cabe en el hueco oscuro del
           arte, para no tapar al personaje. -->
      <div class="column">
        <!-- Arriba del contenido, no del documento: como hijo suelto del body
             caía sobre el marco y el logotipo, porque todo lo demás está
             posicionado y él era el único en flujo. No se había visto nunca
             porque hasta ahora no hubo ninguna actualización que anunciar. -->
        <div class="update" id="update" hidden>
          <span class="update-text" id="update-text" role="status" aria-live="polite"></span>
        </div>

        <section class="frame realm">
          <div class="realm-state">
            <span class="dot" id="state-dot" data-state="unknown"></span>
            <span class="realm-state-text">
              <span id="state-label" role="status" aria-live="polite">Consultando el reino…</span>
              <!-- La edad de la lectura va siempre a la vista: un dato viejo se
                   declara viejo, nunca se enseña como si fuera de ahora. -->
              <small id="state-age" class="age"></small>
            </span>
          </div>

          <dl class="metrics" id="metrics">
            <div><dt>Conectados</dt><dd id="m-players">—</dd></div>
            <div><dt>Cuentas</dt><dd id="m-accounts">—</dd></div>
            <div><dt>En pie</dt><dd id="m-uptime">—</dd></div>
          </dl>
        </section>

        <section class="frame panel">
          <div class="row">
            <div class="field">
              <label for="install-path">Carpeta del juego</label>
              <output id="install-path" class="path">Sin elegir</output>
            </div>
            <button id="btn-choose" class="ghost">Elegir…</button>
          </div>

          <p id="client-note" class="note" role="status" aria-live="polite"></p>

          <p id="warning" class="warn" role="status" aria-live="polite" hidden></p>
          <p id="error" class="error" role="alert" hidden></p>

        </section>

        <section class="frame tweaks" id="tweaks" hidden>
          <h2 class="frame-title">Ajustes del cliente</h2>

          <label class="tweak">
            <input type="checkbox" id="tw-laa" />
            <span>
              <strong>Memoria ampliada (4 GB)</strong>
              <small
                >El cliente es de 32 bits y arranca limitado a 2 GB aunque tengas más.
                Levanta una bandera de su ejecutable para que Windows le deje usar 4 GB.
                Ayuda en bandas y con muchos complementos.</small
              >
            </span>
          </label>

          <label class="tweak">
            <input type="checkbox" id="tw-dxvk" />
            <span>
              <strong>Renderizado por Vulkan (DXVK)</strong>
              <small
                >Traduce Direct3D 9 a Vulkan; suele dar más estabilidad en clientes
                viejos. <em>Experimental:</em> DXVK está hecho para Linux y su uso en
                Windows no lo respaldan sus autores. Si el juego deja de abrir, desmarca
                esto y vuelve a estar como antes.</small
              >
            </span>
          </label>

          <p class="tweak-note" id="tw-note" role="status" aria-live="polite"></p>
        </section>
      </div>
    </main>

    <!-- Banda inferior, como en el launcher original: a la izquierda el estado
         de la descarga, a la derecha el botón grande. -->
    <footer class="dock">
      <div class="dock-left">
        <div class="progress" id="progress" hidden>
          <div
            class="bar"
            id="bar"
            role="progressbar"
            aria-label="Progreso de la descarga del cliente"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span id="bar-fill"></span>
          </div>
          <div class="progress-meta">
            <span id="progress-text">—</span>
            <span id="progress-speed"></span>
          </div>
        </div>

        <div class="realmlist">
          <span>realmlist</span>
          <code id="realmlist-host">—</code>
          <!-- Aparece solo cuando hay una versión descargada y lista. El aviso
               de que existe lo da la barra de arriba; esto es la acción. -->
          <button id="btn-update" class="stone update-now" hidden>Reiniciar e instalar</button>
        </div>

        <!-- Las utilidades, con el marco de hielo del launcher original.
             Buscar actualizaciones no depende de tener el juego; las otras
             tres se apagan hasta que haya carpeta elegida. -->
        <div class="tools" id="tools">
          <button id="btn-open-dir" class="stone" disabled>Abrir la carpeta</button>
          <button id="btn-reset-gfx" class="stone" disabled>Restablecer gráficos</button>
          <button id="btn-verify" class="stone" disabled>Verificar el cliente</button>
          <button id="btn-check-update" class="stone">Buscar actualizaciones</button>
        </div>
      </div>

      <div class="dock-right">
        <button id="btn-stop" class="stone" hidden>Detener</button>
        <!-- La acción que toque ahora mismo: elegir carpeta, comprobar o
             descargar. Desaparece cuando ya solo queda jugar. -->
        <button id="btn-action" class="stone action" hidden>
          <span id="btn-action-label">Elegir carpeta</span>
        </button>
        <!-- El botón grande es SIEMPRE «PLAY», gris mientras no se pueda
             jugar. Es lo que hace el launcher original mientras parchea, y es
             lo que hace que la ventana se lea de un vistazo. -->
      </div>
    </footer>

    <button id="btn-play" class="play" disabled aria-label="Jugar"></button>

    <script src="app.js"></script>
  </body>
</html>
